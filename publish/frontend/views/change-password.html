<div class="bs-scope lg-page">
  <div class="lg-card">

    <img class="lg-logo" src="assets/logo-stacked.png" alt="LearnSphere: Learn, Grow, Connect" width="640" height="483" />

    <div>
      <h1>Set a new password</h1>
      <p class="lg-sub">You're signing in with a temporary password. Please set a new password to continue, {{ vm.user.name }}.</p>
    </div>

    <div class="alert-error" role="alert" ng-if="vm.errorMsg">{{ vm.errorMsg }}</div>

    <form ng-submit="vm.submit()">
      <div class="form-group">
        <label for="cp-current">Temporary Password</label>
        <input id="cp-current" type="password" ng-model="vm.form.currentPassword" required placeholder="Enter the temporary password" autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label for="cp-new">New Password</label>
        <input id="cp-new" type="password" ng-model="vm.form.newPassword" required placeholder="Min. 8 characters" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="cp-confirm">Confirm New Password</label>
        <input id="cp-confirm" type="password" ng-model="vm.form.confirmPassword" required placeholder="Re-enter new password" autocomplete="new-password" />
        <div class="field-error" ng-if="vm.form.confirmPassword && vm.form.newPassword !== vm.form.confirmPassword">Passwords do not match.</div>
      </div>
      <button type="submit" class="bs-btn bs-btn-primary bs-btn-block" ng-disabled="vm.loading">
        <span ng-if="!vm.loading">Set New Password</span>
        <span ng-if="vm.loading">Saving...</span>
      </button>
    </form>

    <p style="text-align:center; margin:0;">
      <a href="" class="tnc-link" ng-click="vm.logout()">Sign out instead</a>
    </p>

  </div>
</div>

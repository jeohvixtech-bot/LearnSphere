<div class="login-page">

  <!-- ── Left hero panel ──────────────────────────── -->
  <div class="login-hero">
    <div class="login-hero-body">
      <div class="login-hero-icon">🔒</div>
      <h1 class="login-hero-title">LearnSphere</h1>
      <p class="login-hero-tagline">Secure Your Account<br/>Before You Continue</p>
    </div>
  </div>

  <!-- ── Right form panel ─────────────────────────── -->
  <div class="login-panel">
    <div class="login-card">

      <div class="login-card-header">
        <h2>Set a new password 🔑</h2>
        <p>You're signing in with a temporary password. Please set a new password to continue, {{ vm.user.name }}.</p>
      </div>

      <div class="alert-error" ng-if="vm.errorMsg">{{ vm.errorMsg }}</div>

      <form ng-submit="vm.submit()">
        <div class="form-group">
          <label>Temporary Password</label>
          <input type="password" ng-model="vm.form.currentPassword" required placeholder="Enter the temporary password" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" ng-model="vm.form.newPassword" required placeholder="Min. 8 characters" />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" ng-model="vm.form.confirmPassword" required placeholder="Re-enter new password" />
          <div class="field-error" ng-if="vm.form.confirmPassword && vm.form.newPassword !== vm.form.confirmPassword">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn-primary full-width" ng-disabled="vm.loading">
          <span ng-if="!vm.loading">Set New Password →</span>
          <span ng-if="vm.loading">Saving...</span>
        </button>
      </form>

      <p style="text-align:center; margin-top:16px">
        <span class="tnc-link" ng-click="vm.logout()">Sign out instead</span>
      </p>

    </div>
  </div>

</div>
